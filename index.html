<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#006eb8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10181f" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved light/dark choice before first paint (otherwise the device setting applies).
      try {
        var t = localStorage.getItem('trafficpulse.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (localStorage.getItem('trafficpulse.textSize') === 'large') document.documentElement.dataset.text = 'large';
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TrafficPulse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>TrafficPulse – Live Singapore Expressway Traffic</title>
