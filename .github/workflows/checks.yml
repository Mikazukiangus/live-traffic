# Type check, parser tests and a production build on every push and pull request,
# so a broken change (or a change in LTA/NEA/PUB data formats the tests cover) shows before merging.
name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Install exactly what bun.lock pins, the same way Vercel does (see vercel.json).
      # A package.json change without an updated bun.lock fails here instead of drifting.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - name: Type check
        run: npm run lint
      - name: HTTPS and cookie policy
        run: npm run security:audit
      - name: Parser tests
        run: npm test
      - name: Build
        run: npm run build
