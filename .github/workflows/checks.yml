# Type check, unit/integration coverage and a production build on every push and pull request,
# so a broken change (or a change in LTA/NEA/PUB data formats the tests cover) shows before merging.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Vercel requires this workflow's `checks` job for production promotion.
# One run per PR revision avoids competing push/PR checks on the same commit.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified official revision
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, verified official revision
        with:
          node-version: 24
      # Install exactly what bun.lock pins, the same way Vercel does (see vercel.json).
      # A package.json change without an updated bun.lock fails here instead of drifting.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, verified official tag
        with:
          bun-version: 1.4.1
      - name: Install pinned secret scanner
        run: |
          sh scripts/install-gitleaks.sh "$RUNNER_TEMP/trafficpulse-security-bin"
          echo "$RUNNER_TEMP/trafficpulse-security-bin" >> "$GITHUB_PATH"
      - name: Scan complete Git history for secrets
        run: gitleaks git --redact=100 --no-banner --config=.gitleaks.toml --log-opts="--all" .
      - run: bun install --frozen-lockfile
      - name: Dependency advisory audit
        run: bun audit --audit-level=high
      - name: Type check
        run: npm run lint
      - name: Private environment file permissions
        run: npm run security:env-permissions
      - name: HTTPS and cookie policy
        run: npm run security:audit
      - name: Unit and integration tests with coverage
        run: npm run test:coverage
      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, verified official revision
        with:
          name: critical-path-coverage
          path: |
            coverage/lcov.info
            coverage/summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Build
        run: npm run build
      - name: Scan public build artifacts for secrets
        run: gitleaks dir --redact=100 --no-banner --config=.gitleaks.toml dist
